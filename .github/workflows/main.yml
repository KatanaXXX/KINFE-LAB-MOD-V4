
name: Build RIPTIDE Knife Lab

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build RIPTIDE
        working-directory: RIPTIDE-KNIFE-LAB-v4/RIPTIDE-KNIFE-LAB-v4/riptide-knife-lab
        run: gradle build

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: RIPTIDE-Knife-Lab-V4
          path: RIPTIDE-KNIFE-LAB-v4/RIPTIDE-KNIFE-LAB-v4/riptide-knife-lab/build/libs/*.jar
          if-no-files-found: error

